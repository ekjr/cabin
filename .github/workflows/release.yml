name: Release Magisk ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Magisk module
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d module ]; then
            echo "module directory not found" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME:-manual}"
          ARTIFACT="Cabin-${VERSION}.zip"
          rm -f "$ARTIFACT"
          zip -r "$ARTIFACT" module >/dev/null
          echo "artifact=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Upload zip to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
          draft: false
          generate_release_notes: true
